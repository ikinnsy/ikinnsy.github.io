<!-- about.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- [EDIT] Browser tab title. i18n key: meta.about.title -->
        <title data-i18n="meta.about.title">About | Your Name</title>

        <!-- [EDIT] Search-result description, roughly 120-160 characters.
             i18n key: meta.about.description -->
        <meta name="description" content="About page. Replace this description."
              data-i18n-content="meta.about.description">

        <link rel="icon" href="./assets/img/favicon.ico" type="image/x-icon">

        <link rel="stylesheet" href="./assets/css/reset.css">
        <link rel="stylesheet" href="./assets/css/style.css">

        <!-- [SYNC] Language alternates - keep identical on every page, except that
             the path matches the current page. [TBD] See README.md for why these
             hreflang links do not yet give real multi-language SEO. -->
        <link rel="alternate" hreflang="zh" href="./about.html?lang=zh">
        <link rel="alternate" hreflang="ja" href="./about.html?lang=ja">
        <link rel="alternate" hreflang="x-default" href="./about.html">

        <script src="./assets/js/main.js" defer></script>
        <script src="./assets/js/i18n.js" defer></script>
    </head>

    <body id="top">

        <!-- [EDIT MAP] ==========================================================
             Everything on this page that still needs your input.
             Status words are written WITHOUT brackets on purpose, so that
               Select-String -Path about.html -Pattern '\[EDIT\]'
             only matches the real field markers in this file.

               key                       what it is                status
               ------------------------- ------------------------- --------------
               meta.about.title          browser tab title         EDIT, I18N
               meta.about.description    search result summary     EDIT, I18N
               site.brand                name / handle in header   EDIT, I18N
               about.heading             page h1                   EDIT, I18N
               about.bio                 bio paragraph             EDIT, I18N
               about.skills.heading      skills heading            EDIT, I18N
               about.skills.empty        skills empty state        EDIT, I18N
               about.timeline.heading    timeline heading          EDIT, I18N
               about.timeline.empty      timeline empty state      EDIT, I18N
               timeline entries          real entries              TODO

             Markers: [EDIT] fill me in | [TODO] content comes later
                      [TBD] intentionally undecided
                      [I18N] must also exist in locales/en.json, zh.json, ja.json
                      [SYNC] keep identical on every page
                      [STRUCT] layout code - do not edit
             ==================================================================== -->

        <!-- [SYNC] Skip link - keep identical on every page. -->
        <a class="skip-link" href="#main" data-i18n="common.skipLink">Skip to content</a>

        <!-- [SYNC] Header shell - keep identical on every page.
             [EDIT] Only the aria-current attribute moves between pages. -->
        <header>
            <!-- [EDIT] Site brand / display name. i18n key: site.brand -->
            <p class="brand" data-i18n="site.brand">Your Name</p>

            <nav aria-label="Main navigation" data-i18n-aria-label="nav.mainLabel">
                <ul>
                    <!-- [SYNC] Put aria-current="page" on the current page only. -->
                    <li><a href="./index.html" data-i18n="nav.home">Home</a></li>
                    <li><a href="./about.html" data-i18n="nav.about" aria-current="page">About</a></li>
                    <li><a href="./projects.html" data-i18n="nav.projects">Projects</a></li>
                    <li><a href="./contact.html" data-i18n="nav.contact">Contact</a></li>
                </ul>

                <!-- [SYNC] Language switcher - keep identical on every page.
                     i18n.js marks the active button with aria-current="true", and
                     style.css turns that into the highlighted state. -->
                <div class="lang-switcher" role="group" aria-label="Language"
                     data-i18n-aria-label="nav.langGroupLabel">
                    <button type="button" id="lang-en" data-lang="en" data-i18n="nav.langEn">English</button>
                    <button type="button" id="lang-zh" data-lang="zh" data-i18n="nav.langZh">Chinese</button>
                    <button type="button" id="lang-ja" data-lang="ja" data-i18n="nav.langJa">Japanese</button>
                </div>
            </nav>
        </header>
        <main id="main">
            <!-- [STRUCT] About page order: bio -> skills -> timeline.
                 Each section stands alone and can be removed on its own. -->

            <section id="bio">
                <h1 data-i18n="about.heading">About</h1>

                <!-- [EDIT] Two to four sentences. The short version lives on
                     index.html. i18n key: about.bio -->
                <p data-i18n="about.bio">Write two to four sentences about yourself here.</p>
            </section>

            <!-- [STRUCT] Skills. Structure only for now. -->
            <section id="skills">
                <h2 data-i18n="about.skills.heading">Skills</h2>

                <!-- [TODO] Delete this empty state and add your own list once you
                     know what to show. A simple <ul> works well here.
                     i18n key: about.skills.empty -->
                <p class="empty-state" data-i18n="about.skills.empty">Skills will be listed here.</p>
            </section>

            <!-- [STRUCT] Timeline. Structure only - there are no real entries yet,
                 and none may be invented. -->
            <section id="timeline">
                <h2 data-i18n="about.timeline.heading">Timeline</h2>

                <!-- [TODO] Delete this empty state once you have real entries.
                     i18n key: about.timeline.empty -->
                <p class="empty-state" data-i18n="about.timeline.empty">No entries yet.</p>

                <!-- [TODO] Entry template. Copy this whole block once per entry,
                     uncomment it, and replace every placeholder value.
                     The matching i18n keys (about.timeline.item1.*) already exist in
                     locales/en.json, zh.json and ja.json.
                <article class="timeline-entry">
                    <p class="timeline-period" data-i18n="about.timeline.item1.period">20XX - 20XX</p>
                    <h3 data-i18n="about.timeline.item1.title">Entry title</h3>
                    <p data-i18n="about.timeline.item1.desc">Short description of this entry.</p>
                </article>
                -->
            </section>
        </main>

        <!-- [SYNC] Footer shell - keep identical on every page. -->
        <footer>
            <!-- [SYNC] The year is filled in by main.js. "2026" is the no-JS fallback. -->
            <p class="copyright">
                <span data-year>2026</span> &copy;
                <!-- [EDIT] Your name or handle. Reuses the site.brand key. -->
                <span data-i18n="site.brand">Your Name</span>
            </p>

            <!-- [TODO] Optional: uncomment this line if you want a "last updated" note.
            <p data-i18n="footer.updated">Last updated: TBD</p>
            -->

            <a class="back-to-top" href="#top" data-i18n="footer.backToTop">Back to top</a>
        </footer>
        
    </body>
</html>
