<!-- 404.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- The text in <title> and in content="" below is the no-JS fallback, so it
             holds the English version. i18n keys: meta.notFound.title /
             meta.notFound.description -->
        <title data-i18n="meta.notFound.title">Page not found | Shenyan Jin</title>

        <meta name="description" content="Page not found."
              data-i18n-content="meta.notFound.description">

        <link rel="icon" href="/assets/img/favicon.ico" type="image/x-icon">

        <!-- [STRUCT] 404.html is the one page that must use root-absolute paths.
             GitHub Pages serves this file for ANY unknown path (for example
             /typo/deep/path), and the browser resolves relative URLs against that
             path, not against this file. "./assets/css/style.css" would therefore
             turn into "/typo/deep/assets/css/style.css" and 404 again.
             The hrefs inside the body are absolute for the same reason, which is
             why this page is NOT part of the [SYNC] shell set. The markup is
             otherwise identical, so a change to the shell still needs to be
             mirrored here by hand. -->
        <link rel="stylesheet" href="/assets/css/reset.css">
        <link rel="stylesheet" href="/assets/css/style.css">

        <!-- [SYNC] Language alternates - keep identical on every page, except that
             the path matches the current page. [TBD] See README.md for why these
             hreflang links do not yet give real multi-language SEO. -->
        <link rel="alternate" hreflang="zh" href="/404.html?lang=zh">
        <link rel="alternate" hreflang="ja" href="/404.html?lang=ja">
        <link rel="alternate" hreflang="x-default" href="/404.html">

        <script src="/assets/js/main.js" defer></script>
        <script src="/assets/js/i18n.js" defer></script>
    </head>

    <body id="top">

        <!-- [EDIT MAP] ==========================================================
             Nothing on this page still needs input. The content is filled in.

             To change any text, edit the value in locales/en.json, zh.json or ja.json -
             not here. The English text inside the elements below is only the no-JS
             fallback, so keep it in sync with locales/en.json when you change a value.

             If you add a NEW field, mark it [EDIT] here and in the body, then run
               Select-String -Path *.html -Pattern '\[EDIT\]'
             to list everything still outstanding.

             Markers used across the site:
                      [TBD] intentionally undecided
                      [I18N] must also exist in locales/en.json, zh.json, ja.json
                      [SYNC] keep identical on every page
                      [STRUCT] layout code - do not edit

             [STRUCT] This is not one of the four main pages, so no nav item
             carries aria-current="page" here.
             ==================================================================== -->

        <!-- [SYNC] Skip link - keep identical on every page. -->
        <a class="skip-link" href="#main" data-i18n="common.skipLink">Skip to content</a>

        <!-- [SYNC] Header shell - keep identical on every page, except that the
             hrefs here are root-absolute (see the [STRUCT] note in <head>).
             [EDIT] Only the aria-current attribute moves between pages. -->
        <header>
            <!-- [EDIT] Site brand / display name. i18n key: site.brand -->
            <p class="brand" data-i18n="site.brand">Shenyan Jin</p>

            <nav aria-label="Main navigation" data-i18n-aria-label="nav.mainLabel">
                <ul>
                    <!-- [SYNC] Put aria-current="page" on the current page only. -->
                    <li><a href="/index.html" data-i18n="nav.home">Home</a></li>
                    <li><a href="/about.html" data-i18n="nav.about">About</a></li>
                    <li><a href="/projects.html" data-i18n="nav.projects">Projects</a></li>
                    <li><a href="/contact.html" data-i18n="nav.contact">Contact</a></li>
                </ul>

                <!-- [SYNC] Language switcher - keep identical on every page.
                     i18n.js marks the active button with aria-current="true", and
                     style.css turns that into the highlighted state. -->
                <div class="lang-switcher" role="group" aria-label="Language"
                     data-i18n-aria-label="nav.langGroupLabel">
                    <button type="button" id="lang-en" data-lang="en" data-i18n="nav.langEn">English</button>
                    <button type="button" id="lang-zh" data-lang="zh" data-i18n="nav.langZh">Chinese</button>
                    <button type="button" id="lang-ja" data-lang="ja" data-i18n="nav.langJa">Japanese</button>
                </div>
            </nav>
        </header>

        <main id="main">
            <!-- [STRUCT] GitHub Pages serves this page for any unknown path. -->
            <section id="not-found">
                <!-- [EDIT] i18n key: notFound.heading -->
                <h1 data-i18n="notFound.heading">Page not found</h1>

                <!-- [EDIT] i18n key: notFound.body -->
                <p data-i18n="notFound.body">The page you were looking for does not exist or has moved.</p>

                <!-- [SYNC] The only way out of this page, apart from the nav.
                     Root-absolute for the same reason as the nav links above. -->
                <div class="cta-row">
                    <a class="btn" href="/index.html" data-i18n="notFound.home">Back to home</a>
                </div>
            </section>
        </main>

        <!-- [SYNC] Footer shell - keep identical on every page. -->
        <footer>
            <!-- [SYNC] The year is filled in by main.js. "2026" is the no-JS fallback. -->
            <p class="copyright">
                <span data-year>2026</span> &copy;
                <span data-i18n="site.brand">Shenyan Jin</span>
            </p>

            <!-- [TODO] The date is not generated automatically. Update footer.updated in
                 locales/en.json, zh.json and ja.json when you change the site. -->
            <p data-i18n="footer.updated">Last updated: 2026-09-25</p>

            <a class="back-to-top" href="#top" data-i18n="footer.backToTop">Back to top</a>
        </footer>

    </body>
</html>
