<!-- projects.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- [EDIT] Browser tab title. i18n key: meta.projects.title -->
        <title data-i18n="meta.projects.title">Projects | Your Name</title>

        <!-- [EDIT] Search-result description, roughly 120-160 characters.
             i18n key: meta.projects.description -->
        <meta name="description" content="Projects page. Replace this description."
              data-i18n-content="meta.projects.description">

        <link rel="icon" href="./assets/img/favicon.ico" type="image/x-icon">

        <link rel="stylesheet" href="./assets/css/reset.css">
        <link rel="stylesheet" href="./assets/css/style.css">

        <!-- [SYNC] Language alternates: identical on all 4 pages, except that the
             path matches the current page. [TBD] See the note in index.html about
             the single-URL limitation. -->
        <link rel="alternate" hreflang="zh" href="./projects.html?lang=zh">
        <link rel="alternate" hreflang="ja" href="./projects.html?lang=ja">
        <link rel="alternate" hreflang="x-default" href="./projects.html">

        <script src="./assets/js/main.js" defer></script>
        <script src="./assets/js/i18n.js" defer></script>
    </head>

    <body id="top">

        <!-- [EDIT MAP] ==========================================================
             Everything on this page that still needs your input.
             Status words are written WITHOUT brackets on purpose, so that
               Select-String -Path projects.html -Pattern '\[EDIT\]'
             only matches the real field markers in this file.

               key                       what it is                status
               ------------------------- ------------------------- --------------
               meta.projects.title       browser tab title         EDIT, I18N
               meta.projects.description search result summary     EDIT, I18N
               site.brand                name / handle in header   EDIT, I18N
               projects.heading          page h1                   EDIT, I18N
               projects.intro            intro paragraph           EDIT, I18N
               projects.empty            empty state               EDIT, I18N
               project cards             real project items        TODO

             Markers: [EDIT] fill me in | [TODO] content comes later
                      [TBD] intentionally undecided
                      [I18N] must also exist in locales/en.json, zh.json, ja.json
                      [SYNC] must stay identical on all 4 pages
                      [STRUCT] layout code - do not edit
             ==================================================================== -->

        <!-- [SYNC] Skip link: identical on all 4 pages. -->
        <a class="skip-link" href="#main" data-i18n="common.skipLink">Skip to content</a>

        <!-- [SYNC] Header shell: must stay identical on all 4 pages.
             [EDIT] Only the aria-current attribute moves between pages.
             If you change this block, change it in index.html, about.html,
             projects.html and contact.html as well. -->
        <header>
            <!-- [EDIT] Site brand / display name. i18n key: site.brand -->
            <p class="brand" data-i18n="site.brand">Your Name</p>

            <nav aria-label="Main navigation" data-i18n-aria-label="nav.mainLabel">
                <ul>
                    <!-- [SYNC] Put aria-current="page" on the current page only. -->
                    <li><a href="./index.html" data-i18n="nav.home">Home</a></li>
                    <li><a href="./about.html" data-i18n="nav.about">About</a></li>
                    <li><a href="./projects.html" data-i18n="nav.projects" aria-current="page">Projects</a></li>
                    <li><a href="./contact.html" data-i18n="nav.contact">Contact</a></li>
                </ul>

                <!-- [SYNC] Language switcher: identical on all 4 pages.
                     i18n.js marks the active button with aria-current="true", and
                     style.css turns that into the highlighted state. -->
                <div class="lang-switcher" role="group" aria-label="Language"
                     data-i18n-aria-label="nav.langGroupLabel">
                    <button type="button" id="lang-en" data-lang="en" data-i18n="nav.langEn">English</button>
                    <button type="button" id="lang-zh" data-lang="zh" data-i18n="nav.langZh">Chinese</button>
                    <button type="button" id="lang-ja" data-lang="ja" data-i18n="nav.langJa">Japanese</button>
                </div>
            </nav>
        </header>
        <main id="main">
            <!-- [STRUCT] Projects page: intro -> list.
                 There are no real items yet, so the empty state below is what a
                 visitor currently sees. -->

            <section id="projects-intro">
                <h1 data-i18n="projects.heading">Projects</h1>

                <!-- [EDIT] One or two lines about what belongs on this page.
                     i18n key: projects.intro -->
                <p data-i18n="projects.intro">One or two lines about the work you want to show here.</p>
            </section>

            <!-- [STRUCT] Project list. Structure only. -->
            <section id="projects-list">
                <!-- [TODO] Friendly empty state. Delete it once you have real items.
                     i18n key: projects.empty -->
                <p class="empty-state" data-i18n="projects.empty">Portfolio coming soon.</p>

                <!-- [TODO] Card template. Copy this whole <li> once per project,
                     uncomment the list, and replace every placeholder value.
                     The matching i18n keys (projects.item1.*) already exist in
                     locales/en.json, zh.json and ja.json.
                <ul class="project-grid">
                    <li class="project-card">
                        <h3 data-i18n="projects.item1.title">Project One</h3>
                        <p data-i18n="projects.item1.desc">Short description of the project.</p>
                        <p class="project-tech" data-i18n="projects.item1.tech">Tech stack: TBD</p>
                        <a class="text-link" href="https://example.com" data-i18n="projects.item1.link">View project</a>
                    </li>
                </ul>
                -->
            </section>
        </main>

        <!-- [SYNC] Footer shell: must stay identical on all 4 pages. -->
        <footer>
            <!-- [SYNC] The year is filled in by main.js. "2026" is the no-JS fallback. -->
            <p class="copyright">
                <span data-year>2026</span> &copy;
                <!-- [EDIT] Your name or handle. Reuses the site.brand key. -->
                <span data-i18n="site.brand">Your Name</span>
            </p>

            <!-- [TODO] Optional: uncomment this line if you want a "last updated" note.
            <p data-i18n="footer.updated">Last updated: TBD</p>
            -->

            <a class="back-to-top" href="#top" data-i18n="footer.backToTop">Back to top</a>
        </footer>
        
    </body>
</html>
